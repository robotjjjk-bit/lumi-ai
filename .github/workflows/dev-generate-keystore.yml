name: DEV - Generate Android signing keystore (one-off)

# TEMPORARY helper workflow — delete it once the signing secrets are configured.
#
# Creates a fresh JKS release keystore and publishes it together with its
# credentials as a short-lived build artifact so the maintainer can copy them
# into the repository secrets:
#
#   ANDROID_KEYSTORE_BASE64   = contents of keystore.jks.b64
#   ANDROID_KEYSTORE_PASSWORD = STORE_PASSWORD in credentials.txt
#   ANDROID_KEY_PASSWORD      = KEY_PASSWORD in credentials.txt
#   ANDROID_KEY_ALIAS         = ALIAS in credentials.txt
#
# Needed to sign the release APK. Without it, Gradle fails on
# ':app:packageUniversalRelease' with "Tag number over 30 is not supported",
# because the decoded keystore.jks is empty.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate JKS keystore
        run: |
          set -euo pipefail
          ALIAS="lumi"
          # Single strong password for both store and key: JKS allows distinct
          # values, but keeping them equal avoids mismatched-secret failures.
          STORE_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | cut -c1-28)"
          KEY_PASSWORD="$STORE_PASSWORD"
          DNAME="CN=Lumi AI, OU=Mobile, O=Lumi AI, L=Unknown, ST=Unknown, C=US"

          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storetype JKS \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "$DNAME"

          keytool -list -v \
            -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$ALIAS" > keystore-info.txt

          base64 -w0 keystore.jks > keystore.jks.b64
          {
            echo "ALIAS=$ALIAS"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > credentials.txt
          sha256sum keystore.jks | tee keystore.jks.sha256

          echo "keystore.jks size: $(stat -c%s keystore.jks) bytes"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-signing-keystore
          path: |
            keystore.jks.b64
            credentials.txt
            keystore-info.txt
            keystore.jks.sha256
          retention-days: 1