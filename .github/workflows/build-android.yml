name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fail in seconds instead of ~15 minutes into the Rust/Gradle build when
      # the four signing secrets are not configured on the repository.
      - name: Verify signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Configure them at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "The release APK cannot be signed without a keystore; aborting early."
            exit 1
          fi
          echo "OK: all 4 signing secrets are present."

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_VERSION=29.0.14206865" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk

      - name: Set CARGO_HOME
        run: echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/android/app
          # printf (not echo) so a stray trailing newline can never be decoded
          # into the keystore file and corrupt it.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/keystore.jks
          if [ ! -s src-tauri/gen/android/app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty. ANDROID_KEYSTORE_BASE64 must be base64 of a .jks file (base64 -w0 keystore.jks)."
            exit 1
          fi
          echo "Decoded keystore: $(stat -c%s src-tauri/gen/android/app/keystore.jks) bytes"

      # Catch a wrong format/password/alias here with a readable message instead
      # of letting Gradle fail deep inside ':app:packageUniversalRelease'.
      - name: Verify keystore is readable
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore src-tauri/gen/android/app/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"
          echo "OK: keystore is valid and alias '$ANDROID_KEY_ALIAS' exists."

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bun run tauri android build --apk

      - name: Prepare APK (arm64-v8a only)
        run: |
          set -euo pipefail
          apk_dir="src-tauri/gen/android/app/build/outputs/apk"
          echo "=== All generated APKs ==="
          find "$apk_dir" -name '*.apk' -type f | sort

          # AGP with splits.abi produces one APK per ABI (app-<abi>-release.apk)
          # plus a fat app-universal-release.apk. Only arm64-v8a ships, so pick
          # the arm64-v8a APK — tolerating every known naming variant. The ABI
          # check below is the real gate.
          src=""
          # 1) the plain ABI split APK
          src="$(find "$apk_dir" -name 'app-arm64-v8a-release.apk' -type f | sort | sed -n '1p')"
          # 2) any arm64-v8a release APK that is not the fat universal one
          if [ -z "$src" ]; then
            src="$(find "$apk_dir" -name '*arm64-v8a*release*.apk' -type f ! -name '*universal*' | sort | sed -n '1p')"
          fi
          # 3) last resort: any arm64-v8a APK at all
          if [ -z "$src" ]; then
            src="$(find "$apk_dir" -name '*arm64-v8a*.apk' -type f | sort | sed -n '1p')"
          fi

          if [ -z "$src" ]; then
            echo "::error::No arm64-v8a release APK was produced (see the APK list above)."
            exit 1
          fi

          mkdir -p android-apks
          cp "$src" android-apks/lumi-ai-android-arm64-v8a.apk
          echo "Shipped: $src -> android-apks/lumi-ai-android-arm64-v8a.apk"

          # Verify the packaged payload really targets arm64-v8a and nothing else.
          abis="$(unzip -l android-apks/lumi-ai-android-arm64-v8a.apk \
            | awk -F'lib/' '/lib\// {split($2,a,"/"); print a[1]}' | sort -u)"
          echo "=== Native ABIs inside the shipped APK ==="
          echo "$abis"
          echo "$abis" | grep -qx 'arm64-v8a' \
            || { echo "::error::Shipped APK has no arm64-v8a native libs."; exit 1; }
          [ "$(echo "$abis" | wc -l)" = "1" ] \
            || { echo "::error::Shipped APK contains more than one ABI:"; echo "$abis"; exit 1; }

          ls -lh android-apks/

      - name: Upload APK (arm64-v8a only)
        uses: actions/upload-artifact@v6
        with:
          name: lumi-ai-android-arm64-v8a.apk
          path: android-apks/lumi-ai-android-arm64-v8a.apk
          if-no-files-found: error
